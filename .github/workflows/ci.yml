name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Python ${{ matrix.python-version }}
    runs-on: [self-hosted, macOS, ARM64, permitdiff]
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          python-version: ${{ matrix.python-version }}
      - name: Create Python environment
        run: |
          uv python install "${{ matrix.python-version }}"
          uv venv --python "${{ matrix.python-version }}" .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install -e '.[dev]'
      - run: python -m pytest

  quality:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, permitdiff]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          python-version: "3.13"
      - name: Create Python environment
        run: |
          uv python install 3.13
          uv venv --python 3.13 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install -e '.[dev]'
      - name: Validate source release lifecycle
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" && "$HEAD_REF" == release/prepare-* ]]; then
            python scripts/check_release.py --prepared
          elif [[ "$EVENT_NAME" == "push" ]]; then
            python scripts/check_release.py --source
          else
            python scripts/check_release.py --development
          fi
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy src
      - run: python scripts/generate_schemas.py --check
      - name: Verify intentional policy block
        run: |
          set +e
          permitdiff compare examples/baseline.yaml examples/candidate.yaml \
            examples/corpus.jsonl --gate examples/gate.yaml --format json \
            --output permitdiff-report.json
          status=$?
          set -e
          test "$status" -eq 2
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: permitdiff-example-report
          path: permitdiff-report.json
          if-no-files-found: error
          retention-days: 14

  package:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, permitdiff]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.12"
          python-version: "3.13"
      - name: Create Python environment
        run: |
          uv python install 3.13
          uv venv --python 3.13 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - run: uv pip install -e '.[dev]'
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Installed-wheel smoke test
        run: |
          rm -rf /tmp/permitdiff-smoke
          uv venv --python 3.13 /tmp/permitdiff-smoke
          uv pip install --python /tmp/permitdiff-smoke/bin/python dist/*.whl
          /tmp/permitdiff-smoke/bin/python scripts/smoke_install.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
