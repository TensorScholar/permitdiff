name: R3 live public discovery capture

on:
  push:
    branches:
      - research/r3-live-discovery-v1
    paths:
      - .github/workflows/r3-live-discovery.yml
      - scripts/discover_r3_benchmark_candidates.py
      - scripts/discover_r3_public_benchmark_candidates.py
      - tests/test_r3_discovery.py
      - tests/test_r3_public_discovery.py

permissions:
  contents: read

concurrency:
  group: r3-live-public-discovery-v1
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  UV_NO_PROGRESS: "1"
  DISCOVERY_BASE_COMMIT: e7c13d5af354bdacc67cd49af62bf2b926629174

jobs:
  capture:
    runs-on: [self-hosted, macOS, ARM64, permitdiff]
    timeout-minutes: 120
    steps:
      - name: Checkout exact discovery branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify runner toolchain and frozen base
        run: |
          command -v uv
          uv --version
          git rev-parse HEAD
          git cat-file -e "$DISCOVERY_BASE_COMMIT^{commit}"
          git merge-base --is-ancestor "$DISCOVERY_BASE_COMMIT" HEAD

      - name: Create Python environment
        run: |
          uv python install 3.13
          rm -rf .venv
          uv venv --python 3.13 .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Install research tooling
        run: uv pip install -e '.[dev]'

      - name: Validate discovery harness before collection
        run: |
          python -m pytest -q --no-cov tests/test_r3_discovery.py tests/test_r3_public_discovery.py
          ruff format --check \
            scripts/discover_r3_benchmark_candidates.py \
            scripts/discover_r3_public_benchmark_candidates.py \
            tests/test_r3_discovery.py \
            tests/test_r3_public_discovery.py
          ruff check \
            scripts/discover_r3_benchmark_candidates.py \
            scripts/discover_r3_public_benchmark_candidates.py \
            tests/test_r3_discovery.py \
            tests/test_r3_public_discovery.py

      - name: Capture public-only discovery ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p validation/r3-benchmark/exploratory/live-capture-v1
          python -m scripts.discover_r3_public_benchmark_candidates discover \
            --output validation/r3-benchmark/exploratory/live-capture-v1/discovery-ledger.json \
            --progress-output validation/r3-benchmark/exploratory/live-capture-v1/discovery-progress.json

      - name: Validate ledger schema and research invariants
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from jsonschema import Draft202012Validator, FormatChecker

          root = Path('.').resolve()
          ledger_path = root / 'validation/r3-benchmark/exploratory/live-capture-v1/discovery-ledger.json'
          schema_path = root / 'docs/r3-discovery-ledger.schema.json'

          ledger_bytes = ledger_path.read_bytes()
          ledger = json.loads(ledger_bytes)
          schema = json.loads(schema_path.read_text(encoding='utf-8'))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema, format_checker=FormatChecker()).validate(ledger)

          if ledger['discovery_complete'] is not True:
              raise SystemExit('discovery_complete is not true; capture is inadmissible for selection')
          if any(
              t['contamination_status'] != 'clean' and t['screening_status'] == 'eligible'
              for t in ledger['transitions']
          ):
              raise SystemExit('contaminated transition marked eligible')

          workflow_commit = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          summary = {
              'ledger_sha256': hashlib.sha256(ledger_bytes).hexdigest(),
              'discovered_location_count': ledger['discovered_location_count'],
              'transition_count': ledger['transition_count'],
              'query_count': len(ledger['queries']),
              'discovery_complete': ledger['discovery_complete'],
              'source': ledger['source'],
              'plan_version': ledger['plan_version'],
              'protocol_version': ledger['protocol_version'],
              'workflow_commit': workflow_commit,
              'merged_discovery_base_commit': os.environ['DISCOVERY_BASE_COMMIT'],
          }
          out = ledger_path.with_name('capture-summary.json')
          out.write_text(json.dumps(summary, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Verify no product execution occurred
        run: |
          test -f validation/r3-benchmark/exploratory/live-capture-v1/discovery-ledger.json
          test ! -e validation/r3-benchmark/exploratory/live-capture-v1/permitdiff-results.json

      - name: Upload immutable discovery capture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r3-live-public-discovery-v1
          path: validation/r3-benchmark/exploratory/live-capture-v1/
          if-no-files-found: error
          retention-days: 30

      - name: Upload failed discovery diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r3-live-public-discovery-diagnostics-${{ github.run_id }}
          path: validation/r3-benchmark/exploratory/live-capture-v1/
          if-no-files-found: warn
          retention-days: 14
