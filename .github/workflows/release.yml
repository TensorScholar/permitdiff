name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[dev,release]'
      - name: Validate immutable release identity
        run: |
          python scripts/check_release.py \
            --tag "$GITHUB_REF_NAME" \
            --expected-date "$(date -u +%F)"
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Installed-wheel smoke test
        run: |
          python -m venv /tmp/permitdiff-smoke
          /tmp/permitdiff-smoke/bin/python -m pip install dist/*.whl
          /tmp/permitdiff-smoke/bin/python scripts/smoke_install.py
      - name: Checkout pinned external repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: SpearIT-LLC/project-framework
          ref: d8a47de7f5f96d501432a7f02c6909c667a5f31d
          fetch-depth: 2
          persist-credentials: false
          path: external/project-framework
      - name: Validate release wheel in external repository
        working-directory: external/project-framework
        run: |
          /tmp/permitdiff-smoke/bin/python ../../scripts/validate_external_repository.py \
            --expected-origin https://github.com/SpearIT-LLC/project-framework \
            --baseline-commit 28133b63a9a54621c8d7be879ba671daf8464c1c \
            --candidate-commit d8a47de7f5f96d501432a7f02c6909c667a5f31d \
            --source-path .claude/settings.local.json \
            --baseline-blob 87d28d71c3a8b65142e5e090e8deb42130fd3637 \
            --candidate-blob 2e5f2bb998c7e5ed4d6394b8934144207546472d \
            --evidence-root ../../validation/public-claude-permission-widening \
            --wheel ../../dist/permitdiff-*.whl \
            --output ../../dist/external-repository-evidence.json
          test -z "$(git status --porcelain)"
      - name: Generate reproducible CycloneDX SBOM
        run: |
          cyclonedx-py environment /tmp/permitdiff-smoke/bin/python \
            --spec-version 1.6 --output-format JSON --output-reproducible \
            --output-file dist/permitdiff-sbom.cdx.json
          python scripts/finalize_cyclonedx_sbom.py \
            --sbom dist/permitdiff-sbom.cdx.json \
            --subject dist/permitdiff-*.whl
      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum \
            *.whl \
            *.tar.gz \
            permitdiff-sbom.cdx.json \
            external-repository-evidence.json \
            > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/external-repository-evidence.json
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl
          sbom-path: dist/permitdiff-sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  github-release-draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Create draft GitHub Release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_args=(--draft --generate-notes --verify-tag)
          if [[ "$GITHUB_REF_NAME" =~ (a|b|rc)[0-9]+$ ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${release_args[@]}"
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "true"

  publish-pypi:
    needs: [build, github-release-draft]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/permitdiff/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: dist
      - name: Stage only Python distribution files for PyPI
        run: |
          mkdir pypi-dist
          cp dist/*.whl dist/*.tar.gz pypi-dist/
      - uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # v1.14.1
        with:
          packages-dir: pypi-dist/
          print-hash: true

  github-release:
    needs: [github-release-draft, publish-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Publish GitHub Release after PyPI succeeds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          release_is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
          if [[ "$release_is_draft" == "true" ]]; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --verify-tag
          elif [[ "$release_is_draft" != "false" ]]; then
            echo "unexpected GitHub Release draft state: $release_is_draft" >&2
            exit 1
          fi
          test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')" = "false"
