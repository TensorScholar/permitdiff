name: Example permission scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"

jobs:
  scan:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, permitdiff]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect scan-relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tee /tmp/changed.txt
          if grep -qE '^(action.yml|examples/|src/permitdiff/)' /tmp/changed.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No action.yml, examples/, or src/permitdiff/ changes; example scan skipped."
          fi
      - name: Verify runner toolchain
        if: steps.changes.outputs.relevant == 'true'
        run: |
          command -v uv
          uv --version
      - name: Create Python environment
        if: steps.changes.outputs.relevant == 'true'
        run: |
          uv python install 3.13
          rm -rf .venv
          uv venv --python 3.13 --seed .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Select immutable baseline ref
        if: steps.changes.outputs.relevant == 'true'
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Run PermitDiff composite Action
        if: steps.changes.outputs.relevant == 'true'
        id: permitdiff
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/baseline.yaml
          baseline-ref: ${{ steps.baseline.outputs.ref }}
          candidate: examples/candidate.yaml
          corpus: examples/corpus.jsonl
          gate: examples/gate.yaml
      - name: Verify intentional policy block and review artifacts
        if: steps.changes.outputs.relevant == 'true'
        env:
          STEP_OUTCOME: ${{ steps.permitdiff.outcome }}
          PERMITDIFF_OUTCOME: ${{ steps.permitdiff.outputs.outcome }}
          REPORT: ${{ steps.permitdiff.outputs.report }}
          SARIF: ${{ steps.permitdiff.outputs.sarif }}
          BASELINE_EVIDENCE: ${{ steps.permitdiff.outputs.baseline_evidence }}
          BASELINE_COMMIT: ${{ steps.permitdiff.outputs.baseline_commit }}
          BASELINE_OBJECT: ${{ steps.permitdiff.outputs.baseline_object }}
        run: |
          test "$STEP_OUTCOME" = "failure"
          test "$PERMITDIFF_OUTCOME" = "blocked"
          test -s "$REPORT"
          test -s "$SARIF"
          test -s "$BASELINE_EVIDENCE"
          test -n "$BASELINE_COMMIT"
          test -n "$BASELINE_OBJECT"
          python - "$BASELINE_EVIDENCE" "$BASELINE_COMMIT" "$BASELINE_OBJECT" <<'PY'
          import json
          import sys
          from pathlib import Path

          evidence = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert evidence["resolved_commit"] == sys.argv[2]
          assert evidence["git_object_id"] == sys.argv[3]
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.changes.outputs.relevant == 'true'
        with:
          name: permitdiff-example-permission-scan
          path: |
            ${{ steps.permitdiff.outputs.report }}
            ${{ steps.permitdiff.outputs.sarif }}
            ${{ steps.permitdiff.outputs.baseline_evidence }}
          if-no-files-found: error
          retention-days: 14
