name: Example permission scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect scan-relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tee /tmp/changed.txt
          if grep -qE '^(action.yml|examples/|src/permitdiff/)' /tmp/changed.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No action.yml, examples/, or src/permitdiff/ changes; example scan skipped."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          python-version: "3.13"
          cache: pip
      - name: Select immutable baseline ref
        if: steps.changes.outputs.relevant == 'true'
        id: baseline
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Run PermitDiff composite Action
        if: steps.changes.outputs.relevant == 'true'
        id: permitdiff
        continue-on-error: true
        uses: ./
        with:
          baseline: examples/baseline.yaml
          baseline-ref: ${{ steps.baseline.outputs.ref }}
          candidate: examples/candidate.yaml
          corpus: examples/corpus.jsonl
          gate: examples/gate.yaml
      - name: Verify intentional policy block and review artifacts
        if: steps.changes.outputs.relevant == 'true'
        env:
          STEP_OUTCOME: ${{ steps.permitdiff.outcome }}
          PERMITDIFF_OUTCOME: ${{ steps.permitdiff.outputs.outcome }}
          REPORT: ${{ steps.permitdiff.outputs.report }}
          SARIF: ${{ steps.permitdiff.outputs.sarif }}
          BASELINE_EVIDENCE: ${{ steps.permitdiff.outputs.baseline-evidence }}
        run: |
          test "$STEP_OUTCOME" = "failure"
          test "$PERMITDIFF_OUTCOME" = "blocked"
          test -s "$REPORT"
          test -s "$SARIF"
          test -s "$BASELINE_EVIDENCE"
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: |
          steps.changes.outputs.relevant == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: ${{ steps.permitdiff.outputs.sarif }}
          category: permitdiff-example
