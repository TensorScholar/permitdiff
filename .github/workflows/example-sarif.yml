name: Example permission scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect scan-relevant changes
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "origin/${{ github.base_ref }}...HEAD" | tee /tmp/changed.txt
          if grep -qE '^(examples/|src/permitdiff/)' /tmp/changed.txt; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
            echo "No examples/ or src/permitdiff/ changes; example scan skipped."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install .
        if: steps.changes.outputs.relevant == 'true'
      - name: Generate SARIF
        if: steps.changes.outputs.relevant == 'true'
        run: |
          set +e
          permitdiff compare examples/baseline.yaml examples/candidate.yaml \
            examples/corpus.jsonl --gate examples/gate.yaml \
            --format sarif --output permitdiff.sarif
          status=$?
          set -e
          test "$status" -eq 2
      - uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        if: |
          steps.changes.outputs.relevant == 'true' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          sarif_file: permitdiff.sarif
          category: permitdiff-example
