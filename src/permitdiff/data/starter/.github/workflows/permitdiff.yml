name: PermitDiff

on:
  pull_request:
    paths:
      - "policies/**"
      - "corpus.jsonl"
      - "permitdiff-gate.yaml"

permissions:
  contents: read
  security-events: write

jobs:
  permission-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install released PermitDiff wheel
        run: >-
          python -m pip install
          "permitdiff @ https://github.com/TensorScholar/permitdiff/releases/download/v0.1.0rc2/permitdiff-0.1.0rc2-py3-none-any.whl#sha256=12092aa0f6428dfac27fc6070224a7b06fb315e6a19be13974d0c1ac5edf16fb"
      - name: Review effective permissions
        run: |
          set +e
          permitdiff compare policies/baseline.yaml policies/candidate.yaml corpus.jsonl \
            --gate permitdiff-gate.yaml --format markdown --output permitdiff-report.md
          status=$?
          permitdiff compare policies/baseline.yaml policies/candidate.yaml corpus.jsonl \
            --gate permitdiff-gate.yaml --format sarif --output permitdiff.sarif >/dev/null 2>&1
          cat permitdiff-report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        if: always()
        with:
          sarif_file: permitdiff.sarif
          category: permitdiff
