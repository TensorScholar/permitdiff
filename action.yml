name: PermitDiff permission gate
description: Compare effective AI-agent tool permissions and block unsafe privilege expansion.
author: Mohammad Atashi
inputs:
  baseline:
    description: Baseline policy path. With baseline-ref, this is a repository-relative Git path.
    required: true
  baseline-ref:
    description: Optional already-fetched Git ref used to resolve the baseline without checkout.
    required: false
  candidate:
    description: Candidate policy path.
    required: true
  corpus:
    description: JSONL scenario corpus path.
    required: true
  gate:
    description: Gate configuration path. Omit to use strict mode.
    required: false
outputs:
  report:
    description: Markdown report path.
    value: ${{ steps.run.outputs.report }}
  sarif:
    description: SARIF 2.1.0 report path.
    value: ${{ steps.run.outputs.sarif }}
  baseline_evidence:
    description: Git baseline provenance JSON path when baseline-ref is used; empty otherwise.
    value: ${{ steps.run.outputs.baseline_evidence }}
  baseline_commit:
    description: Exact resolved baseline commit when baseline-ref is used; empty otherwise.
    value: ${{ steps.run.outputs.baseline_commit }}
  baseline_object:
    description: Exact Git blob object ID for the baseline policy; empty otherwise.
    value: ${{ steps.run.outputs.baseline_object }}
  outcome:
    description: pass, blocked, or error.
    value: ${{ steps.run.outputs.outcome }}
runs:
  using: composite
  steps:
    - name: Install PermitDiff
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"
    - name: Compare effective permissions
      id: run
      shell: bash
      env:
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_BASELINE_REF: ${{ inputs.baseline-ref }}
        INPUT_CANDIDATE: ${{ inputs.candidate }}
        INPUT_CORPUS: ${{ inputs.corpus }}
        INPUT_GATE: ${{ inputs.gate }}
      run: |
        set +e
        common_args=("$INPUT_BASELINE" "$INPUT_CANDIDATE" "$INPUT_CORPUS")
        if [[ -n "$INPUT_GATE" ]]; then
          common_args+=(--gate "$INPUT_GATE")
        else
          common_args+=(--strict)
        fi

        baseline_evidence=""
        markdown_args=("${common_args[@]}")
        if [[ -n "$INPUT_BASELINE_REF" ]]; then
          baseline_evidence="permitdiff-baseline-source.json"
          markdown_args+=(--baseline-ref "$INPUT_BASELINE_REF")
          markdown_args+=(--baseline-evidence-output "$baseline_evidence")
        fi

        permitdiff compare "${markdown_args[@]}" --format markdown --output permitdiff-report.md
        status=$?

        sarif_args=("${common_args[@]}")
        if [[ -n "$INPUT_BASELINE_REF" ]]; then
          if [[ -s "$baseline_evidence" ]]; then
            resolved_commit="$(python - "$baseline_evidence" <<'PY'
        import json
        import re
        import sys
        from pathlib import Path

        evidence = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        resolved = str(evidence.get("resolved_commit", ""))
        if re.fullmatch(r"[0-9a-f]{40}(?:[0-9a-f]{24})?", resolved) is None:
            raise SystemExit("invalid resolved_commit in PermitDiff baseline evidence")
        print(resolved)
        PY
            )"
            pin_status=$?
            if [[ "$pin_status" -ne 0 ]]; then
              echo "report=permitdiff-report.md" >> "$GITHUB_OUTPUT"
              echo "sarif=permitdiff.sarif" >> "$GITHUB_OUTPUT"
              echo "baseline_evidence=$baseline_evidence" >> "$GITHUB_OUTPUT"
              echo "outcome=error" >> "$GITHUB_OUTPUT"
              echo "PermitDiff could not pin the SARIF render to the resolved baseline commit." >&2
              exit 1
            fi
            sarif_args+=(--baseline-ref "$resolved_commit")
          else
            # Re-run the same invalid source selection so renderer status consistency is checked.
            sarif_args+=(--baseline-ref "$INPUT_BASELINE_REF")
          fi
        fi

        permitdiff compare "${sarif_args[@]}" --format sarif --output permitdiff.sarif >/dev/null 2>&1
        sarif_status=$?

        echo "report=permitdiff-report.md" >> "$GITHUB_OUTPUT"
        echo "sarif=permitdiff.sarif" >> "$GITHUB_OUTPUT"
        echo "baseline_evidence=$baseline_evidence" >> "$GITHUB_OUTPUT"
        if [[ -z "$baseline_evidence" ]]; then
          echo "baseline_commit=" >> "$GITHUB_OUTPUT"
          echo "baseline_object=" >> "$GITHUB_OUTPUT"
        fi

        if [[ "$status" -ne "$sarif_status" ]]; then
          echo "outcome=error" >> "$GITHUB_OUTPUT"
          echo "PermitDiff renderers returned inconsistent exit statuses: markdown=$status sarif=$sarif_status" >&2
          exit 1
        fi
        if [[ "$status" -eq 0 || "$status" -eq 2 ]]; then
          if [[ ! -s permitdiff-report.md || ! -s permitdiff.sarif ]]; then
            echo "outcome=error" >> "$GITHUB_OUTPUT"
            echo "PermitDiff did not produce both required review artifacts." >&2
            exit 1
          fi
        fi

        if [[ -n "$baseline_evidence" && -s "$baseline_evidence" ]]; then
          python - "$baseline_evidence" "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY" <<'PY'
        import json
        import sys
        from pathlib import Path

        evidence = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
        github_output = Path(sys.argv[2])

        def code(value: object) -> str:
            return str(value).replace("`", "\\`").replace("\n", " ").replace("\r", " ")

        with github_output.open("a", encoding="utf-8") as handle:
            handle.write(f"baseline_commit={evidence['resolved_commit']}\n")
            handle.write(f"baseline_object={evidence['git_object_id']}\n")

        print("## PermitDiff baseline source")
        print()
        print(f"- requested ref: `{code(evidence['requested_ref'])}`")
        print(f"- resolved commit: `{code(evidence['resolved_commit'])}`")
        print(f"- policy path: `{code(evidence['path'])}`")
        print(f"- Git object: `{code(evidence['git_object_id'])}`")
        print(f"- raw SHA-256: `{code(evidence['raw_sha256'])}`")
        print()
        PY
          summary_status=$?
          if [[ "$summary_status" -ne 0 ]]; then
            echo "outcome=error" >> "$GITHUB_OUTPUT"
            echo "PermitDiff could not render Git baseline provenance." >&2
            exit 1
          fi
        fi

        if [[ -s permitdiff-report.md ]]; then
          cat permitdiff-report.md >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ "$status" -eq 0 ]]; then
          echo "outcome=pass" >> "$GITHUB_OUTPUT"
        elif [[ "$status" -eq 2 ]]; then
          echo "outcome=blocked" >> "$GITHUB_OUTPUT"
        else
          echo "outcome=error" >> "$GITHUB_OUTPUT"
        fi
        exit "$status"
branding:
  icon: shield
  color: purple
