<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">PermitDiff</title>
  <desc id="desc">Permission plans for AI agents</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B14"/>
      <stop offset="0.55" stop-color="#12152A"/>
      <stop offset="1" stop-color="#17112C"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C5CFC"/>
      <stop offset="1" stop-color="#3ED6C4"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="300" rx="28" fill="url(#bg)"/>
  <circle cx="1050" cy="30" r="180" fill="#7C5CFC" opacity=".08"/>
  <circle cx="1150" cy="260" r="220" fill="#3ED6C4" opacity=".06"/>
  <g transform="translate(72 62)">
    <rect width="176" height="176" rx="42" fill="#101426" stroke="#34395C"/>
    <path d="M48 52h80M48 88h48M48 124h80" stroke="#7E88B8" stroke-width="13" stroke-linecap="round"/>
    <path d="M111 82l18 18 34-42" fill="none" stroke="url(#accent)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  </g>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <text x="300" y="126" fill="#F4F5FF" font-size="74" font-weight="760" letter-spacing="-2">PermitDiff</text>
    <text x="304" y="175" fill="#A8AECF" font-size="25" font-weight="500">Permission plans for AI agents</text>
    <rect x="304" y="204" width="630" height="4" rx="2" fill="url(#accent)" opacity=".95"/>
    <text x="304" y="248" fill="#D9DCF3" font-size="20">Detect privilege expansion before it reaches production.</text>
  </g>
